name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "ethereum/**"
      - "tron/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evm-foundry:
    name: EVM Foundry build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethereum
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Foundry version
        run: forge --version

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests
        run: forge test -vv

  tron-compile:
    name: Tron compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx tronbox compile

  tron-test:
    name: Tron tests (TRE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Start TRE container
        run: docker run --platform linux/arm64 -d --name tre -p 9095:9090 tronbox/tre

      - name: Wait for TRE RPC
        run: |
          for i in {1..90}; do
            response="$(curl -sS -X POST "http://127.0.0.1:9095/wallet/getnowblock" \
              -H "Content-Type: application/json" \
              -d "{}" || true)"
            if [[ "$response" == *"blockID"* ]]; then
              echo "TRE is ready"
              exit 0
            fi
            sleep 2
          done
          echo "TRE did not become ready in time"
          docker ps -a || true
          docker logs tre || true
          exit 1

      - name: Export TRE development private key
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          logs = subprocess.check_output(
              ["docker", "logs", "tre"],
              stderr=subprocess.STDOUT,
              text=True,
              errors="replace",
          )
          # Remove ANSI escape sequences that can break simple regex parsing.
          logs = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", logs)
          # Parse key for account index (0) from any log format.
          match = re.search(r"\(0\)\s*([0-9a-fA-F]{64})", logs, flags=re.MULTILINE)
          if not match:
              print("Failed to parse TRE private key from container logs")
              print(logs)
              sys.exit(1)

          key = match.group(1).lower()
          github_env = os.environ.get("GITHUB_ENV")
          if not github_env:
              print("GITHUB_ENV is not set")
              sys.exit(1)

          with open(github_env, "a", encoding="utf-8") as f:
              f.write(f"PRIVATE_KEY_DEVELOPMENT={key}\n")
          print("Exported PRIVATE_KEY_DEVELOPMENT from TRE logs")
          PY

      - name: Run Tron tests
        run: npx tronbox test --network development

      - name: Stop TRE container
        if: always()
        run: docker rm -f tre
