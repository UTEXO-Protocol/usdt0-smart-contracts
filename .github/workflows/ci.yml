name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "ethereum/**"
      - "tron/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evm-foundry:
    name: EVM Foundry build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethereum
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Foundry version
        run: forge --version

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests
        run: forge test -vv

  tron-compile:
    name: Tron compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx tronbox compile

  tron-test:
    name: Tron tests (TRE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start TRE container
        run: docker run -d --name tre -p 9095:9090 tronbox/tre

      - name: Wait for TRE RPC
        run: |
          for i in {1..150}; do
            response="$(curl -sS -X POST "http://127.0.0.1:9095/wallet/getnowblock" \
              -H "Content-Type: application/json" \
              -d "{}" || true)"
            if [[ "$response" == *"blockID"* ]]; then
              echo "TRE is ready"
              exit 0
            fi
            sleep 2
          done
          echo "TRE did not become ready in time"
          docker ps -a || true
          docker logs tre || true
          exit 1

      - name: Run Tron tests
        run: npx tronbox test --network development

      - name: Stop TRE container
        if: always()
        run: docker rm -f tre
